name: Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"   # diario, 01:00 hora de Quito
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  # ── Tarjetas de perfil (reemplaza github-profile-summary-cards.vercel.app) ──
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  # ── lowlighter/metrics (reemplaza streak-stats y activity-graph) ──
  metrics:
    runs-on: ubuntu-latest
    needs: summary-cards        # evita pushes simultáneos
    steps:
      # Racha actual, mejor racha y calendario del año
      - name: Isocalendar (streak)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAucancela
          filename: metrics.isocalendar.svg
          committer_branch: metrics
          base: ""
          config_timezone: America/Guayaquil
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Lenguajes más usados
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAucancela
          filename: metrics.languages.svg
          committer_branch: metrics
          base: ""
          config_timezone: America/Guayaquil
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook, dockerfile, shell
          plugin_languages_colors: github

      # Logros (versión compacta)
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAucancela
          filename: metrics.achievements.svg
          committer_branch: metrics
          base: ""
          config_timezone: America/Guayaquil
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8
